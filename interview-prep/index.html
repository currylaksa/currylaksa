{i:'m02',g:'5G',q:'What does the CU/DU/RU functional split let an operator do?',o:['Remove the need for a core network','Centralise higher-layer processing (CU) while distributing latency-sensitive functions (DU) and keeping only radio functions at the tower (RU)','Run the network without fibre','Eliminate the need for spectrum licences'],a:1,w:'Splitting the base station lets operators pool CU resources in an edge data centre while DUs sit closer to the antennas. The result is cheaper sites, easier upgrades, and the ability to place functions according to their latency budget.'},
{i:'m03',g:'5G',q:'Which link connects the RU to the DU?',o:['Backhaul','Midhaul','Fronthaul','Sidehaul'],a:2,w:'Fronthaul runs RU to DU and is the most demanding segment — very low latency and high bandwidth, typically dark fibre or CWDM carrying eCPRI. Midhaul is DU to CU, and backhaul carries CU traffic to the core.'},
{i:'m04',g:'5G',q:'What is network slicing?',o:['Splitting spectrum between operators','Running multiple logical end-to-end networks with independent performance and isolation guarantees over one physical infrastructure','Dividing a cell into sectors','Compressing user traffic'],a:1,w:'Each slice gets its own virtual resources and SLA, so a low-latency factory automation slice can coexist with a best-effort consumer broadband slice on the same hardware. It is one of the genuinely new capabilities 5G standalone brings.'},
{i:'m05',g:'5G',q:'What distinguishes 5G Standalone (SA) from Non-Standalone (NSA)?',o:['SA uses only mmWave','SA uses the 5G core; NSA anchors 5G radio to the existing 4G EPC core','NSA is faster','SA does not support voice'],a:1,w:'NSA was the fast route to market — new radio bolted onto the LTE core — but it cannot deliver slicing or true URLLC. SA introduces the cloud-native 5G core, which is where features like slicing and edge computing actually come from.'},
{i:'m06',g:'5G',q:'Which 5G service category targets industrial control and remote surgery?',o:['eMBB','URLLC','mMTC','VoLTE'],a:1,w:'URLLC is ultra-reliable low-latency communication, engineered for millisecond latency and extreme reliability. eMBB is high-bandwidth consumer data, and mMTC is huge numbers of low-power IoT devices.'},
{i:'m07',g:'5G',q:'What is the role of the UPF in the 5G core?',o:['It authenticates subscribers','It is the user-plane function forwarding subscriber data traffic, and it can be pushed to the edge to cut latency','It manages radio handovers','It stores billing records'],a:1,w:'The UPF is the data-plane anchor between the RAN and external networks. Because the 5G core separates control and user planes, operators can place UPFs close to users for edge computing while control functions stay centralised.'},
{i:'m08',g:'5G',q:'Which 5G core function handles registration, authentication and mobility for a device?',o:['UPF','AMF','SMF','NRF'],a:1,w:'The AMF is the Access and Mobility Management Function — the control-plane entry point for the device. The SMF manages PDU sessions and instructs the UPF, so AMF is "who and where", SMF is "what session".'},
{i:'m09',g:'5G',q:'What is the practical trade-off of mmWave spectrum?',o:['Huge bandwidth and capacity, but very short range and poor penetration through walls and foliage','Long range but low capacity','It works only indoors','It requires no line of sight'],a:0,w:'mmWave delivers enormous throughput over very short distances and is easily blocked by a hand or a window. That is why real deployments layer it over sub-6 GHz mid-band, which supplies the coverage.'},
{i:'m10',g:'5G',q:'What does massive MIMO with beamforming achieve?',o:['It increases the licensed spectrum available','It uses many antenna elements to steer focused beams at individual users, raising capacity and coverage on the same spectrum','It removes the need for a base station','It converts 4G to 5G automatically'],a:1,w:'Instead of radiating power in all directions, the array shapes energy toward specific devices and serves many users simultaneously on the same frequency. It is a spectral-efficiency gain, not a spectrum gain.'},
{i:'m11',g:'5G',q:'What is the goal of O-RAN?',o:['To make radio networks proprietary','To define open, standardised interfaces between RAN components so operators can mix vendors','To eliminate the core network','To replace fibre with wireless backhaul'],a:1,w:'Traditional RAN is a single-vendor stack from radio to controller. O-RAN opens the interfaces — notably the fronthaul and the RIC — so an operator can source radios from one vendor and baseband from another.'},
{i:'m12',g:'5G',q:'What is the most common reason an enterprise deploys private 5G instead of Wi-Fi?',o:['It is always cheaper','Deterministic latency, predictable coverage over large or harsh sites, and controlled handover for mobile assets like AGVs','Wi-Fi cannot be encrypted','Private 5G needs no spectrum'],a:1,w:'Ports, mines and factories need reliable coverage across wide outdoor areas with seamless mobility for moving machinery, which is where Wi-Fi roaming and contention struggle. Wi-Fi remains cheaper and simpler for ordinary office coverage.'},
{i:'m13',g:'WAN',q:'What is the fundamental advantage of SD-WAN over traditional MPLS-only WAN?',o:['MPLS is insecure','SD-WAN builds an encrypted overlay across any transport — broadband, LTE, MPLS — and steers applications per policy','SD-WAN removes the need for routers','MPLS cannot carry voice'],a:1,w:'SD-WAN decouples the overlay from the underlay, so cheap internet circuits can carry corporate traffic with central policy and per-application path selection. MPLS still offers a hard SLA, which is why many designs keep it for the most sensitive traffic.'},
{i:'m14',g:'WAN',q:'How does MPLS forward traffic?',o:['By performing a full IP routing lookup at every hop','By swapping fixed-length labels, with the routing decision made once at the edge','By broadcasting to all neighbours','By using MAC addresses'],a:1,w:'The ingress router classifies the packet into a forwarding equivalence class and pushes a label; core routers then swap labels without inspecting the IP header. That is also what makes MPLS VPNs and traffic engineering possible.'},
{i:'m15',g:'WAN',q:'What is the difference between an underlay and an overlay network?',o:['They are the same','The underlay is the physical IP transport that provides reachability; the overlay is the virtual topology tunnelled across it','The overlay is always faster','The underlay carries only management traffic'],a:1,w:'The underlay just has to move packets between endpoints. The overlay — VXLAN, IPsec, GRE — builds the logical segmentation and services on top, which is why you can change transport providers without redesigning the logical network.'},
{i:'m16',g:'Data centre',q:'What problem does VXLAN solve?',o:['It encrypts data-centre traffic','It tunnels Layer 2 over Layer 3 and provides 16 million segments via a 24-bit VNI, versus 802.1Q\'s 4094 VLANs','It replaces BGP','It eliminates the need for switches'],a:1,w:'The 12-bit VLAN ID caps you at about 4000 segments, which is nowhere near enough for a multi-tenant cloud. VXLAN encapsulates Ethernet in UDP so segments can stretch across a routed fabric without a giant spanning-tree domain.'},
{i:'m17',g:'Data centre',q:'Why do modern data centres use a leaf-spine fabric instead of the classic three-tier design?',o:['It uses fewer cables','Every leaf is one hop from every other leaf via a spine, giving predictable latency and full use of all links via ECMP','It removes the need for routing','Spanning tree runs faster on it'],a:1,w:'Three-tier designs were built for north-south traffic and waste capacity on STP-blocked links. Leaf-spine gives uniform east-west performance and scales by adding spines, with ECMP using every path at once.'},
{i:'m18',g:'Cloud',q:'What is a VPC?',o:['A physical data centre','A logically isolated virtual network within a cloud provider, where you define your own address space, subnets and routing','A VPN client','A load-balancing algorithm'],a:1,w:'A VPC is your private slice of the provider\'s network: you choose the CIDR, carve subnets across availability zones, and control routing and gateways. It is the cloud analogue of your on-premises L3 domain.'},
{i:'m19',g:'Cloud',q:'What actually makes a cloud subnet "public" rather than "private"?',o:['Its instances have password authentication disabled','Its route table has a route to an internet gateway','It uses a public CIDR range','It has no security group'],a:1,w:'The subnet is public purely because of its routing — a 0.0.0.0/0 route pointing at the internet gateway. A private subnet lacks that route and reaches out through a NAT gateway instead.'},
{i:'m20',g:'Cloud',q:'How do security groups and network ACLs differ?',o:['They are identical','Security groups are stateful and applied per instance; NACLs are stateless and applied per subnet, needing explicit rules in both directions','NACLs are stateful, security groups are stateless','Security groups work only on IPv6'],a:1,w:'A security group automatically allows return traffic for anything it permitted outbound. A NACL evaluates each direction independently, so forgetting the ephemeral-port return rule is the classic reason a NACL change breaks everything.'},
{i:'m21',g:'Cloud',q:'What does a NAT gateway do in a cloud VPC?',o:['It publishes private servers to the internet','It lets instances in private subnets reach the internet outbound, while blocking unsolicited inbound connections','It routes between VPCs','It terminates TLS'],a:1,w:'It gives private workloads outbound access for patching and API calls without exposing them. Because translations are only created outbound, the internet cannot initiate a session back in.'},
{i:'m22',g:'Cloud',q:'Why use a dedicated private circuit (Direct Connect / ExpressRoute) instead of a site-to-site VPN to the cloud?',o:['It is always cheaper','Consistent bandwidth and latency with an SLA, rather than riding the public internet','VPNs cannot be encrypted','It removes the need for routing'],a:1,w:'A VPN over the internet is quick and cheap but inherits the internet\'s variability. A private circuit gives predictable performance for large data transfers and latency-sensitive workloads, at higher cost and lead time.'},
{i:'m23',g:'Cloud',q:'You have twenty VPCs that all need to talk to each other. Why is a transit gateway better than full-mesh peering?',o:['Peering does not support encryption','Full mesh needs n(n−1)/2 connections and per-VPC route management; a transit gateway is a hub with one attachment per VPC','Peering is slower','Transit gateways are free'],a:1,w:'Twenty VPCs in full mesh means 190 peering links and a route-table nightmare. A hub-and-spoke transit gateway reduces that to twenty attachments with centralised routing and inspection.'},
{i:'m24',g:'Load balancing',q:'What can a Layer 7 load balancer do that a Layer 4 one cannot?',o:['Handle more connections','Route on URL path, hostname or headers, terminate TLS, and rewrite requests','Work with UDP','Operate without health checks'],a:1,w:'An L4 balancer only sees IP and port, so it forwards fast but blindly. An L7 balancer parses HTTP, enabling path-based routing to microservices, TLS offload and header-based canary releases — at higher CPU cost.'},
{i:'m25',g:'Load balancing',q:'When is "least connections" a better algorithm than round robin?',o:['Never','When request durations vary widely, since round robin ignores how busy each server already is','Only for UDP traffic','When all servers are identical and requests are uniform'],a:1,w:'Round robin assumes every request costs the same. If some requests are long-lived, a strict rotation piles work onto an already-loaded server, while least connections tracks actual outstanding sessions.'},
{i:'m26',g:'Load balancing',q:'What is the purpose of session affinity (sticky sessions)?',o:['To improve encryption','To keep a client pinned to the same backend when server-side session state is not shared','To reduce the number of servers needed','To bypass health checks'],a:1,w:'It is a workaround for stateful backends — necessary, but it undermines even load distribution and makes a server failure user-visible. Externalising session state to a shared cache is the better long-term answer.'},
{i:'m27',g:'Load balancing',q:'Why does a load balancer need active health checks rather than just watching for TCP errors?',o:['To measure bandwidth','Because a server can accept TCP connections while the application behind it is broken — only an application-level probe catches that','To assign IP addresses','To terminate TLS'],a:1,w:'A listening socket says nothing about whether the app can serve a request. Probing a real endpoint that exercises the dependencies is what lets the balancer pull a sick node out before users notice.'},
{i:'m28',g:'CDN',q:'How does anycast let a CDN send users to a nearby edge node?',o:['By using DNS round robin only','The same IP prefix is advertised from many locations via BGP, so each user\'s traffic goes to the topologically closest one','By assigning each user a static route','By tunnelling all traffic to one origin'],a:1,w:'Every edge announces the identical prefix, and normal BGP best-path selection delivers each client to the nearest instance. It also absorbs DDoS naturally, because an attack is split across every site advertising the prefix.'},
{i:'m29',g:'IPv6',q:'How long is an IPv6 address, and how is a standard subnet sized?',o:['64 bits, subnetted at /32','128 bits, with /64 as the standard subnet size','128 bits, with /24 as the standard subnet size','256 bits, with /128 subnets'],a:1,w:'IPv6 addresses are 128 bits and interfaces are almost always given a /64, because SLAAC and Neighbour Discovery assume a 64-bit interface identifier. Sites typically receive a /48 and carve /64s from it.'},
{i:'m30',g:'IPv6',q:'What does SLAAC do?',o:['It assigns addresses from a central DHCP server','It lets a host build its own address from the prefix advertised in a Router Advertisement','It translates IPv6 to IPv4','It encrypts IPv6 traffic'],a:1,w:'The router advertises the prefix and the host generates the interface identifier itself, so no server is needed to hand out addresses. DHCPv6 still exists for cases where you need central control and tracking.'},
{i:'m31',g:'IPv6',q:'Which prefix identifies an IPv6 link-local address?',o:['fc00::/7','fe80::/10','2001:db8::/32','::1/128'],a:1,w:'fe80::/10 is link-local, present on every IPv6 interface and never routed off the segment. fc00::/7 is unique local (the RFC 1918 analogue), 2001:db8::/32 is documentation, and ::1 is loopback.'},
{i:'m32',g:'IPv6',q:'IPv6 has no broadcast. What replaced ARP?',o:['RARP','Neighbour Discovery Protocol using ICMPv6 multicast','DNS','Proxy ARP'],a:1,w:'NDP uses ICMPv6 Neighbour Solicitation to a solicited-node multicast group, so only the relevant hosts are interrupted rather than the whole segment. NDP also handles router discovery, prefix advertisement and duplicate address detection.'},
{i:'m33',g:'IPv6',q:'What is dual stack?',o:['Two routers for redundancy','Running IPv4 and IPv6 simultaneously on the same interfaces so hosts use whichever the destination supports','Tunnelling IPv6 inside IPv4','Two firewalls in series'],a:1,w:'Dual stack is the least disruptive migration path, but remember every security policy must be written twice. An IPv6 path that nobody filtered is a genuinely common gap in otherwise well-secured networks.'},
{i:'m34',g:'QoS',q:'Which DSCP marking is conventionally used for voice bearer traffic?',o:['AF11','EF (Expedited Forwarding, DSCP 46)','CS1','Best effort (0)'],a:1,w:'EF is designed for low-loss, low-latency, low-jitter traffic and is normally serviced by a strict priority queue. Call signalling is usually marked CS3, which is why voice designs mark two different classes.'},
{i:'m35',g:'QoS',q:'Which impairment does a VoIP call tolerate LEAST well?',o:['A steady 60 ms of latency','Jitter — variable delay that outruns the de-jitter buffer','Bandwidth headroom','A single lost packet'],a:1,w:'Constant latency is manageable and one lost packet is concealed, but variable inter-arrival timing empties or overflows the buffer and produces audible choppiness. That is why voice gets a priority queue rather than just more bandwidth.'},
{i:'m36',g:'QoS',q:'What is the difference between traffic shaping and policing?',o:['They are the same','Shaping buffers excess traffic and delays it to a target rate; policing drops or re-marks it immediately','Policing buffers, shaping drops','Shaping applies only to inbound traffic'],a:1,w:'Shaping smooths bursts at the cost of delay and memory, which suits outbound WAN links where TCP will adapt. Policing is cheap and instant but its drops trigger retransmissions, so it is better for enforcing a hard contract.'},
{i:'m37',g:'SDN',q:'What is the central idea of SDN?',o:['Replacing all hardware with software routers','Separating the control plane from the data plane so a controller programs forwarding centrally','Removing the need for IP addresses','Encrypting the control plane'],a:1,w:'In traditional networking every device runs its own control plane and you configure them one by one. SDN centralises the decision-making so policy is expressed once and pushed down, which is what makes intent-based operation possible.'},
{i:'m38',g:'Automation',q:'Why is NETCONF with YANG preferred over screen-scraping the CLI?',o:['It is faster to type','It exchanges structured, schema-validated data over a transactional API, so changes can be validated and rolled back',' It works without authentication','It requires no network connectivity'],a:1,w:'CLI scraping breaks the moment output formatting changes and cannot tell success from a silently ignored command. NETCONF/YANG gives a typed model with candidate configurations and commit/rollback semantics — the difference between scripting and engineering.'},
{i:'m39',g:'Automation',q:'What is idempotency, and why does it matter in network automation?',o:['Running a task twice doubles its effect','Running a task repeatedly converges on the same end state, so re-running a playbook is safe','It encrypts configuration files','It measures configuration drift'],a:1,w:'Declarative tools describe the desired state rather than the steps, so applying them to an already-correct device changes nothing. That is what makes it safe to run automation continuously to correct drift.'},
{i:'m40',g:'Automation',q:'What is configuration drift?',o:['A routing protocol failing to converge','Devices diverging from the intended baseline through manual, undocumented changes','Latency increasing over time','A DHCP scope filling up'],a:1,w:'Drift is how a "standard" network quietly becomes forty snowflakes, and it is usually discovered during an outage or an audit. Version-controlled intent plus periodic compliance checks is the standard defence.'},
{i:'m41',g:'Edge',q:'What is the networking rationale for multi-access edge computing (MEC)?',o:['It reduces the cost of servers','Placing compute near the radio edge cuts round-trip latency for applications that cannot tolerate a trip to a central data centre','It removes the need for a core network','It increases available spectrum'],a:1,w:'Physics sets a floor on latency: a few hundred kilometres of fibre costs milliseconds no clever protocol can recover. Moving the workload to the edge — alongside a local UPF — is the only way to reach single-digit millisecond response.'},
{i:'m42',g:'Containers',q:'Why does a Kubernetes service exist in front of pods?',o:['To encrypt pod traffic','Pod IPs are ephemeral, so the service provides a stable virtual IP and DNS name that load-balances to the current healthy pods','To assign pods to nodes','To store persistent data'],a:1,w:'Pods are replaced constantly and get new IPs each time, so nothing can address them directly. The service is a stable abstraction backed by a controller that keeps the endpoint list current — the same problem a load balancer VIP solves, at container speed.'},
];

 {h:'IPsec in one screen',defs:[
   ['ESP vs AH','ESP encrypts + authenticates. AH authenticates only and breaks through NAT — so you almost always see ESP.'],

 {h:'Principles interviewers listen for',notes:[
   '<b>Zero Trust</b> — never trust, always verify. Network location grants nothing; identity + device posture + context decide, continuously.',
   '<b>Defence in depth</b> — layer independent controls so no single failure is fatal.',
   '<b>Least privilege</b> — grant only what the function needs, to limit blast radius.',
   '<b>Implicit deny</b> — ACLs and policies end in deny-all. Add an explicit logged deny so you can see what is blocked.',
   '<b>Extended ACLs go near the source</b> (drop early); standard ACLs go near the destination (they only match source).',
   '<b>Out-of-band management</b> — keep administrative reach independent of the network you are fixing.']}
]},
ts:{blurb:'Read the symptom, name the layer. Most faults announce themselves.',s:[
 {h:'Symptom → most likely cause',table:{head:['Symptom','Look at'],rows:[
   ['169.254.x.x address','DHCP unreachable — VLAN, scope, ip helper-address'],
   ['Ping IP works, name fails','DNS resolver / record'],
   ['Ping gateway ok, everything else fails','Default route or upstream path'],
   ['Immediate RST','Nothing listening, or an active refuse'],
   ['SYN retransmits, no reply','Silent firewall drop or black hole'],

 {h:'Reading the output',notes:[
   '<b>traceroute * * * mid-path</b> — that hop just does not answer ICMP. If the destination replies, the path is fine.',
   '<b>High latency at one middle hop only</b> — control-plane deprioritisation. Judge latency from the final hop.',
   '<b>Loss that starts at a hop and persists to the end</b> — that is real loss. Loss at one hop that clears afterwards is not.',
   '<b>NXDOMAIN</b> — the resolver answered; the name genuinely does not exist. A <b>timeout</b> means you never reached the resolver.',
   '<b>ping -f -l 1472 works, 1473 fails</b> — path MTU is 1500 (add 8 ICMP + 20 IP).',
   '<b>Bound to 127.0.0.1</b> — the service is loopback-only. Check the bind address before blaming the firewall.']},
 {h:'Pick the right tool',table:{head:['Question','Tool'],rows:[
   ['Is the host reachable at L3?','ping'],
   ['Where does the path break?','traceroute / mtr'],
   ['Is a TCP port open?','telnet, nc, Test-NetConnection'],
   ['What is on the wire?','tcpdump / Wireshark'],
   ['What is this host listening on?','ss -tlnp / netstat -an'],
   ['Is DNS the problem?','nslookup / dig'],
   ['Is it L2 reachable?','arp -n, show mac address-table']]}},
 {h:'Method — say this out loud in the interview',notes:[
   '<b>Scope it.</b> One user → endpoint or port. One VLAN → SVI or trunk. Whole site → edge or circuit. Match the suspect to the size of the outage.',
   '<b>Ask what changed.</b> Most incidents follow a change. Check config diffs and change records before you capture a single packet.',
   '<b>Work one layer at a time</b>, bottom-up when there is no connectivity at all, divide-and-conquer when you have a clue.',
   '<b>Change one variable, then retest.</b> Batch changes teach you nothing and can add a second fault.',
   '<b>Reproduce the real case.</b> "The internet is down" almost always means one specific destination.',
   '<b>Document the fix</b> and roll back anything that did not help.']}
]},
mod:{blurb:'The vocabulary of 5G, cloud and the modern WAN.',s:[
 {h:'5G glossary',table:{head:['Term','What it is'],rows:[
   ['gNB','The 5G base station (LTE calls it eNodeB)'],
   ['RU / DU / CU','Radio unit at the tower · distributed unit · centralised unit'],
   ['Fronthaul','RU → DU. Lowest latency, highest bandwidth, usually fibre/eCPRI'],

   ['AMF','Access & mobility — registration, auth, mobility ("who and where")'],

 {h:'Spectrum trade-off',notes:[
   '<b>mmWave (24 GHz+)</b> — enormous capacity, tiny range, blocked by walls, foliage and hands.',
   '<b>Mid-band sub-6 GHz</b> — the workhorse: the balance of capacity and coverage that real deployments run on.',
   '<b>Low band</b> — wide coverage and good penetration, modest capacity.',
   '<b>Massive MIMO + beamforming</b> raises spectral efficiency, not spectrum — it steers energy at users instead of radiating everywhere.']},

 {h:'WAN, overlay and load balancing',defs:[
   ['SD-WAN vs MPLS','SD-WAN builds an encrypted overlay over any transport with per-application steering. MPLS gives a hard SLA via label switching. Many designs keep both.'],
   ['Underlay vs overlay','Underlay = physical IP reachability. Overlay = the virtual topology tunnelled across it (VXLAN, IPsec, GRE).'],
   ['VXLAN','L2 over L3 with a 24-bit VNI → 16 million segments, versus 4094 VLANs. Ends the giant spanning-tree domain.'],
   ['Leaf-spine','Every leaf one hop from every other via a spine; ECMP uses all links. Built for east-west traffic.'],
   ['L4 vs L7 load balancer','L4 sees IP and port only. L7 parses HTTP — path routing, TLS termination, header-based rules.'],
   ['Anycast','The same prefix advertised from many sites; BGP delivers each user to the nearest. Also absorbs DDoS naturally.']]},
 {h:'QoS',defs:[
   ['EF / DSCP 46','Voice bearer — strict priority queue. Signalling is normally CS3.'],
   ['Worst impairment for VoIP','Jitter. Steady latency is manageable; variable delay wrecks the de-jitter buffer.'],
   ['Shaping vs policing','Shaping buffers and delays to a rate (good outbound, TCP adapts). Policing drops or re-marks instantly (enforces a hard contract).']]}
]}};

/* ===================================================================
   NetDrill — network engineer interview arcade
   Single file, no dependencies, no network. Progress lives in
   localStorage under NETDRILL_V1.
   =================================================================== */
const TRACKS = {
  core:{code:'CR', name:'Core Fundamentals', c:'var(--data)',   bank:BANK_CORE,
        blurb:'OSI, subnetting, TCP/UDP, VLANs, routing'},
  sec: {code:'SC', name:'Network Security',  c:'var(--violet)', bank:BANK_SEC,
        blurb:'Firewalls, IPsec, TLS, Zero Trust, attacks'},
  ts:  {code:'TS', name:'Troubleshooting',   c:'var(--signal)', bank:BANK_TS,
        blurb:'Read the output, name the layer'},
  mod: {code:'TC', name:'Telco · Cloud · Modern', c:'var(--up)', bank:BANK_MOD,
        blurb:'5G, SD-WAN, VPC, IPv6, QoS'}
};
const ALL = [].concat(BANK_CORE, BANK_SEC, BANK_TS, BANK_MOD);
const TRACK_OF = {};
Object.keys(TRACKS).forEach(k => TRACKS[k].bank.forEach(q => { TRACK_OF[q.i] = k; }));

const RANKS = [
  [0,'Patch Cable'], [2500,'Access Switch'], [8000,'Distribution Switch'],
  [20000,'Core Router'], [45000,'Backbone'], [90000,'Autonomous System']
];
const BADGES = {
  first:    ['First Contact',      'Finish your first run'],
  perfect:  ['Line Rate',          'Score 10 / 10 in one run'],
  streak10: ['Full Duplex',        'A 10-answer streak'],
  reflex:   ['Sub-5s Reflex',      'Five correct answers under 5 seconds each'],
  subnet:   ['Subnet Sniper',      'Four subnetting questions right in one run'],
  zerotrust:['Zero Trust, Full Marks','A perfect Network Security run'],
  packet:   ['Packet Whisperer',   'A perfect Troubleshooting run'],
  gauntlet: ['Gauntlet Cleared',   'Score 8+ in the mixed Gauntlet'],
  uptime:   ['Seven Day Uptime',   'Drill seven days running'],
  converged:['Fully Converged',    'Master an entire track']
};

const RUN_LEN = 10, TIME = 30000, KEYS = ['A','B','C','D'];
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => n.toLocaleString('en-US');
const today = () => new Date().toISOString().slice(0,10);

/* ---------- persistence ---------- */
const BLANK = {v:1, xp:0, box:{}, bestStreak:0, badges:[], runs:0, day:{last:'', n:0}, last:{}};
let S = load();
function load(){
  try{
    const raw = localStorage.getItem('NETDRILL_V1');
    if(!raw) return {...BLANK, box:{}, badges:[], day:{last:'',n:0}, last:{}};
    const p = JSON.parse(raw);
    return {...BLANK, ...p, box:p.box||{}, badges:p.badges||[], day:p.day||{last:'',n:0}, last:p.last||{}};
  }catch(e){ return {...BLANK, box:{}, badges:[], day:{last:'',n:0}, last:{}}; }
}
function save(){ try{ localStorage.setItem('NETDRILL_V1', JSON.stringify(S)); }catch(e){} }

/* ---------- progression ---------- */
function rank(xp){
  let i = 0;
  for(let k=0;k<RANKS.length;k++) if(xp >= RANKS[k][0]) i = k;
  const next = RANKS[i+1] || null;
  const floor = RANKS[i][0];
  const pct = next ? Math.round((xp-floor)/(next[0]-floor)*100) : 100;
  return {name:RANKS[i][1], next:next && next[1], toNext:next ? next[0]-xp : 0, pct};
}
const mastered = t => TRACKS[t].bank.filter(q => (S.box[q.i]||0) >= 2).length;
const seenCount = () => ALL.filter(q => S.box[q.i] !== undefined).length;

function grant(id, into){
  if(S.badges.indexOf(id) === -1){ S.badges.push(id); into.push(id); }
}

/* ---------- question selection: unseen first, then weakest ---------- */
function weight(q){
  const b = S.box[q.i];
  if(b === undefined) return 6;      // never seen
  if(b === 0) return 8;              // got it wrong last time
  return b === 1 ? 4 : b === 2 ? 2 : 1;
}
function pick(pool, n){
  const left = pool.slice(), out = [];
  while(out.length < n && left.length){
    let total = 0;
    for(const q of left) total += weight(q);
    let r = Math.random() * total, k = 0;
    for(; k < left.length; k++){ r -= weight(left[k]); if(r <= 0) break; }
    out.push(left.splice(Math.min(k, left.length-1), 1)[0]);
  }
  return out;
}

/* =================== HOME =================== */
function home(){
  stopTimer();
  const r = rank(S.xp);
  const rows = Object.keys(TRACKS).map(k => {
    const t = TRACKS[k], m = mastered(k), pct = Math.round(m/t.bank.length*100);
    const last = S.last[k];
    return `<div class="port" style="--c:${t.c}">
      <button class="port-main" data-act="start" data-track="${k}"><span class="port-inner">
        <span class="port-led"></span><span class="port-code">${t.code}</span>
        <span class="port-body">
          <span class="port-name">${esc(t.name)}</span>
          <span class="port-meta">${t.bank.length} Q · ${m} mastered${last!==undefined?' · last '+last+'/10':''}</span>
          <span class="track"><i style="width:${pct}%"></i></span>
        </span>
        <span class="port-pct">${pct}%</span>
      </span></button>
      <button class="port-recap" data-act="recap" data-track="${k}" aria-label="Recap sheet for ${esc(t.name)}">RECAP</button>
    </div>`;
  }).join('');

  const earned = S.badges.length;
  app.innerHTML = `<div class="screen">
    <div class="readout">
      <div class="lbl">Rank</div>
      <h1 class="rank">${esc(r.name)}</h1>
      <p class="sub">${r.next ? num(r.toNext)+' XP to '+esc(r.next) : 'Top of the ladder. Now keep it converged.'}</p>
      <div class="gauges">
        <div class="gauge"><b>${num(S.xp)}</b><span>Total XP</span></div>
        <div class="gauge"><b>${S.bestStreak}</b><span>Best streak</span></div>
        <div class="gauge"><b>${seenCount()}<i>/${ALL.length}</i></b><span>Seen</span></div>
      </div>
    </div>

    <div class="sec-head"><span class="lbl">Tracks</span></div>
    <div class="ports">${rows}
      <div class="port mix" style="--c:var(--signal)">
        <button class="port-main" data-act="start" data-track="mix"><span class="port-inner">
          <span class="port-led"></span><span class="port-code">GX</span>
          <span class="port-body">
            <span class="port-name">The Gauntlet</span>
            <span class="port-meta">All ${ALL.length} questions, mixed · final-prep mode</span>
          </span>
          <span class="port-pct">→</span>
        </span></button>
      </div>
    </div>

    <div class="sec-head"><span class="lbl">Awards</span><span class="lbl" style="color:var(--dim)">${earned}/${Object.keys(BADGES).length}</span></div>
    <div class="awards" style="justify-content:flex-start">${
      Object.keys(BADGES).map(id => {
        const has = S.badges.indexOf(id) !== -1;
        return `<span class="award${has?'':' locked'}" title="${esc(BADGES[id][1])}">${has?'◆':'◇'} ${esc(BADGES[id][0])}</span>`;
      }).join('')}</div>

    <div class="foot">
      <span class="lbl">${S.runs} run${S.runs===1?'':'s'} logged · progress stays on this device</span>
      <button class="linkbtn" data-act="reset">Reset</button>
    </div>
  </div>`;
  chrome();
}

/* =================== RUN =================== */
let run = null, raf = 0;

function begin(track, retry){
  const pool = track === 'mix' ? ALL : TRACKS[track].bank;
  const qs = retry && retry.length ? retry.slice() : pick(pool, Math.min(RUN_LEN, pool.length));
  run = {track, qs, idx:0, score:0, streak:0, best:0, mult:1, correct:0,
         missed:[], fast:0, subnet:0, locked:false, started:0, left:TIME, retry:!!(retry&&retry.length)};
  question();
}

function question(){
  const q = run.qs[run.idx];
  const tk = TRACKS[TRACK_OF[q.i]];
  app.innerHTML = `<div class="screen">
    <div class="hud">
      <span class="pos">${String(run.idx+1).padStart(2,'0')} / ${String(run.qs.length).padStart(2,'0')}</span>
      <span class="spacer"></span>
      <span class="mult" id="mult" data-hot="${run.mult>1?1:0}">×${run.mult.toFixed(1)}${run.streak>1?' · '+run.streak:''}</span>
      <span class="run-score" id="runScore">${num(run.score)}</span>
    </div>
    <div class="meter"><i id="meterFill"></i></div>
    <div class="card" style="--c:${tk.c}">
      <div class="qtag">${esc(tk.code)} · ${esc(q.g)}</div>
      <p class="qtext">${esc(q.q)}</p>
      ${q.c ? `<pre class="cli" tabindex="0">${esc(q.c)}</pre>` : ''}
      <div class="opts" id="opts">${q.o.map((o,n)=>
        `<button class="opt" data-act="answer" data-n="${n}"><span class="key">${KEYS[n]}</span><span>${esc(o)}</span></button>`
      ).join('')}</div>
    </div>
    <div id="after"></div>
  </div>`;
  run.locked = false;
  startTimer();
}

function startTimer(){
  run.started = performance.now();
  const fill = $('#meterFill');
  const tick = now => {
    if(!run || run.locked) return;
    const left = Math.max(0, TIME - (now - run.started));
    run.left = left;
    const f = left / TIME;
    if(fill){
      fill.style.width = (f*100).toFixed(2)+'%';
      fill.dataset.warn = f < .17 ? '2' : f < .4 ? '1' : '0';
    }
    if(left <= 0){ resolve(-1); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function stopTimer(){ if(raf) cancelAnimationFrame(raf); raf = 0; }

function resolve(chosen){
  if(!run || run.locked) return;
  run.locked = true; stopTimer();
  const q = run.qs[run.idx];
  const elapsed = Math.min(TIME, performance.now() - run.started);
  const timedOut = chosen === -1;
  const right = !timedOut && chosen === q.a;

  let gained = 0;
  if(right){
    run.correct++; run.streak++;
    run.best = Math.max(run.best, run.streak);
    if(elapsed < 5000) run.fast++;
    if(q.g === 'Subnetting') run.subnet++;
    const bonus = Math.round(50 * (1 - elapsed/TIME));
    gained = Math.round((100 + bonus) * run.mult);
    run.score += gained;
    run.mult = Math.min(3, 1 + 0.5 * Math.floor(run.streak/2));
    S.box[q.i] = Math.min(3, (S.box[q.i]||0) + 1);
  }else{
    run.streak = 0; run.mult = 1;
    run.missed.push(q);
    S.box[q.i] = 0;
  }
  save();

  document.querySelectorAll('.opt').forEach((el,n) => {
    el.disabled = true;
    if(n === q.a) el.classList.add('right');
    else if(n === chosen) el.classList.add('wrong');
    else el.classList.add('faded');
  });
  const ms = $('#mult'), sc = $('#runScore');
  if(ms){ ms.textContent = '×'+run.mult.toFixed(1)+(run.streak>1?' · '+run.streak:''); ms.dataset.hot = run.mult>1?1:0; }
  if(sc){ sc.textContent = num(run.score); if(right) sc.classList.add('pulse'); }

  const last = run.idx === run.qs.length - 1;
  const cls = right ? 'ok' : timedOut ? 'out' : 'no';
  const head = right ? 'Correct' : timedOut ? 'Out of time' : 'Not quite';
  $('#after').innerHTML = `<div class="verdict ${cls}">
      <h3>${head}${right?'<em>+'+num(gained)+' pts</em>':'<em>'+esc(KEYS[q.a])+' was right</em>'}</h3>
      <p>${esc(q.w)}</p>
    </div>
    <div class="btn-row">
      <button class="btn primary" data-act="next">${last?'See results':'Next'}</button>
    </div>`;
  const nb = document.querySelector('[data-act="next"]');
  if(nb) nb.focus({preventScroll:true});
}

function next(){
  if(run.idx === run.qs.length - 1) finish();
  else { run.idx++; question(); }
}

/* =================== SUMMARY =================== */
function finish(){
  stopTimer();
  const got = [];
  S.xp += run.score;
  S.runs++;
  S.bestStreak = Math.max(S.bestStreak, run.best);
  if(!run.retry && run.track !== 'mix') S.last[run.track] = run.correct;

  const d = today();
  if(S.day.last !== d){
    const y = new Date(Date.now() - 864e5).toISOString().slice(0,10);
    S.day = {last:d, n: S.day.last === y ? S.day.n + 1 : 1};
  }

  grant('first', got);
  if(run.correct === run.qs.length && run.qs.length === RUN_LEN) grant('perfect', got);
  if(run.best >= 10) grant('streak10', got);
  if(run.fast >= 5) grant('reflex', got);
  if(run.subnet >= 4) grant('subnet', got);
  if(run.track === 'sec'  && run.correct === run.qs.length && run.qs.length === RUN_LEN) grant('zerotrust', got);
  if(run.track === 'ts'   && run.correct === run.qs.length && run.qs.length === RUN_LEN) grant('packet', got);
  if(run.track === 'mix'  && run.correct >= 8) grant('gauntlet', got);
  if(S.day.n >= 7) grant('uptime', got);
  if(Object.keys(TRACKS).some(k => mastered(k) === TRACKS[k].bank.length)) grant('converged', got);
  save();

  const acc = Math.round(run.correct / run.qs.length * 100);
  const line = acc === 100 ? 'Line rate. Nothing dropped.'
    : acc >= 80 ? 'Solid link — minor errors on the interface.'
    : acc >= 50 ? 'Link up, but you are retransmitting.'
    : 'Flapping. Read the recap sheet, then run it again.';
  const r = rank(S.xp);

  app.innerHTML = `<div class="screen">
    <div class="final">
      <div class="lbl">${run.retry ? 'Retry — missed questions' : esc(run.track === 'mix' ? 'The Gauntlet' : TRACKS[run.track].name)}</div>
      <div class="big">${num(run.score)}</div>
      <div class="cap">points</div>
      <div class="verdict-line">${esc(line)}</div>
    </div>
    <div class="statgrid">
      <div><b>${run.correct}/${run.qs.length}</b><span>Correct</span></div>
      <div><b>${acc}%</b><span>Accuracy</span></div>
      <div><b>${run.best}</b><span>Streak</span></div>
      <div><b>${S.day.n}d</b><span>Daily</span></div>
    </div>
    ${got.length ? `<div class="awards">${got.map(id=>`<span class="award">◆ ${esc(BADGES[id][0])}</span>`).join('')}</div>` : ''}
    <div class="sec-head"><span class="lbl">Rank</span><span class="lbl" style="color:var(--dim)">${esc(r.name)}${r.next?' → '+num(r.toNext)+' XP to '+esc(r.next):''}</span></div>
    <div class="track" style="--c:var(--signal)"><i style="width:${r.pct}%"></i></div>

    ${run.missed.length ? `<div class="sec-head"><span class="lbl">Review — ${run.missed.length} missed</span></div>
      ${run.missed.map(q => `<div class="miss">
        <div class="q">${esc(q.q)}</div>
        <span class="a">→ ${esc(q.o[q.a])}</span>
        <p class="w">${esc(q.w)}</p>
      </div>`).join('')}` :
      `<div class="sec-head"><span class="lbl">Review</span></div>
       <div class="card"><p class="qtext" style="font-size:.92rem;color:var(--dim)">Clean sweep — nothing to review.</p></div>`}

    <div class="btn-row">
      ${run.missed.length ? `<button class="btn" data-act="retry">Retry missed</button>` : ''}
      <button class="btn primary" data-act="again">Run again</button>
    </div>
    <div class="btn-row"><button class="btn ghost wide" data-act="home">Back to tracks</button></div>
    <div style="height:2rem"></div>
  </div>`;
  chrome();
}

/* =================== RECAP SHEET =================== */
function recap(k){
  stopTimer();
  const t = TRACKS[k], r = RECAP[k];
  const body = r.s.map(sec => {
    let inner = '';
    if(sec.table){
      inner = `<div class="tblwrap"><table><thead><tr>${sec.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${sec.table.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }else if(sec.defs){
      inner = `<dl class="defs">${sec.defs.map(d=>`<div class="def"><dt>${esc(d[0])}</dt><dd>${esc(d[1])}</dd></div>`).join('')}</dl>`;
    }else if(sec.notes){
      inner = `<ul class="notes">${sec.notes.map(n=>`<li>${n}</li>`).join('')}</ul>`;
    }
    return `<section><h3>${esc(sec.h)}</h3>${inner}</section>`;
  }).join('');

  app.innerHTML = `<div class="screen sheet" style="--c:${t.c}">
    <div style="padding:1.4rem 0 .2rem">
      <div class="lbl" style="color:${t.c}">${esc(t.code)} · Recap sheet</div>
      <h2>${esc(t.name)}</h2>
      <p class="blurb">${esc(r.blurb)}</p>
    </div>
    ${body}
    <div class="btn-row" style="margin-top:1.6rem">
      <button class="btn" data-act="home">Tracks</button>
      <button class="btn primary" data-act="start" data-track="${k}">Drill this track</button>
    </div>
    <div style="height:2rem"></div>
  </div>`;
  window.scrollTo(0,0);
  chrome();
}

/* =================== CHROME + EVENTS =================== */
function chrome(){
  const r = rank(S.xp);
  $('#rankChip').textContent = num(S.xp) + ' XP';
  $('#xpFill').style.width = r.pct + '%';
  const day = $('#dayChip');
  const active = S.day.n > 0 && (S.day.last === today() || S.day.last === new Date(Date.now()-864e5).toISOString().slice(0,10));
  day.textContent = (active ? '▲ ' : '△ ') + S.day.n + 'd';
  day.classList.toggle('hot', active && S.day.n > 1);
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(act === 'start'){ window.scrollTo(0,0); begin(el.dataset.track); }
  else if(act === 'answer'){ resolve(Number(el.dataset.n)); }
  else if(act === 'next'){ next(); }
  else if(act === 'again'){ window.scrollTo(0,0); begin(run.track); }
  else if(act === 'retry'){ window.scrollTo(0,0); begin(run.track, run.missed); }
  else if(act === 'home'){ window.scrollTo(0,0); run = null; home(); }
  else if(act === 'recap'){ recap(el.dataset.track); }
  else if(act === 'reset'){
    if(confirm('Reset all XP, mastery and awards on this device?')){
      S = {...BLANK, box:{}, badges:[], day:{last:'',n:0}, last:{}}; save(); home();
    }
  }
});

document.addEventListener('keydown', e => {
  if(!run || e.metaKey || e.ctrlKey || e.altKey) return;
  if(!run.locked && e.key >= '1' && e.key <= '4'){
    const b = document.querySelector('.opt[data-n="'+(Number(e.key)-1)+'"]');
    if(b){ e.preventDefault(); resolve(Number(e.key)-1); }
  }else if(run.locked && (e.key === 'Enter' || e.key === ' ')){
    const b = document.querySelector('[data-act="next"]');
    if(b){ e.preventDefault(); b.click(); }
  }
});

home();

</script>
